services:
  frontend:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      # Bind mounts from a Windows/macOS host don't deliver file-change events (see vite.config.js)
      CHOKIDAR_USEPOLLING: "true"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

  backend:
    build: ./backend
    volumes:
      - ./backend:/app
      - mise_data:/app/data
    ports:
      - "8001:8001"
    env_file:
      - .env

volumes:
  mise_data:
